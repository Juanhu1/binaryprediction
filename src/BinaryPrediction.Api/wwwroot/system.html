<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System - Binary Prediction</title>
    <link rel="stylesheet" href="dashboard.css">
    <script defer src="system.js"></script>
</head>
<body>
    <header>
        <h1>System</h1>
        <nav>
            <a href="index.html">Operations</a>
            <a href="dashboard.html">Overview</a>
            <a href="markets.html">Markets</a>
            <a href="predictions.html">Predictions</a>
            <a href="opportunities.html">Opportunities</a>
            <a href="analytics.html">Analytics</a>
            <a href="system.html" class="active">System</a>
        </nav>
    </header>
    <main>
        <section class="panel">
            <h2>System Stats</h2>
            <div class="stat-grid" id="system-stats">
                <div class="stat-box"><div class="stat-value" id="total-markets">-</div><div class="stat-label">Total Markets</div></div>
                <div class="stat-box"><div class="stat-value" id="markets-today">-</div><div class="stat-label">Markets Added Today</div></div>
                <div class="stat-box"><div class="stat-value" id="total-predictions">-</div><div class="stat-label">Total Predictions</div></div>
                <div class="stat-box"><div class="stat-value" id="predictions-today">-</div><div class="stat-label">Predictions Generated Today</div></div>
                <div class="stat-box"><div class="stat-value" id="predictions-eval-today">-</div><div class="stat-label">Predictions Evaluated Today</div></div>
                <div class="stat-box"><div class="stat-value" id="total-opportunities">-</div><div class="stat-label">Total Opportunities</div></div>
                <div class="stat-box"><div class="stat-value" id="opps-today">-</div><div class="stat-label">Opportunities Detected Today</div></div>
                <div class="stat-box"><div class="stat-value" id="latest-snapshot">-</div><div class="stat-label">Latest Analytics Snapshot</div></div>
            </div>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Opportunities - Binary Prediction</title>
    <link rel="stylesheet" href="dashboard.css">
    <script defer src="opportunities.js"></script>
</head>
<body>
    <header>
        <h1>Opportunities</h1>
        <nav>
            <a href="index.html">Operations</a>
            <a href="dashboard.html">Overview</a>
            <a href="markets.html">Markets</a>
            <a href="predictions.html">Predictions</a>
            <a href="opportunities.html" class="active">Opportunities</a>
            <a href="analytics.html">Analytics</a>
            <a href="system.html">System</a>
        </nav>
    </header>
    <main>
        <section class="panel">
            <h2>Opportunities</h2>
            <div class="filter-bar" style="margin-bottom:1rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
                <input type="text" id="search-input" placeholder="Search..." style="padding:0.4rem; flex:1; min-width:200px;">
                <select id="status-filter" style="padding:0.4rem;">
                    <option value="">All Statuses</option>
                    <option value="Active">Active</option>
                    <option value="Resolved">Resolved</option>
                </select>
                <input type="number" id="mingap-input" placeholder="Min Gap %" style="padding:0.4rem; width:120px;"/>
                <input type="number" id="maxgap-input" placeholder="Max Gap %" style="padding:0.4rem; width:120px;"/>
                <button id="apply-filters" style="padding:0.4rem 0.8rem;">Apply</button>
            </div>
            <div class="table-wrapper">
                <table id="opportunities-table">
                    <thead>
                        <tr>
                            <th data-sort="question">Question</th>
                            <th data-sort="category">Category</th>
                            <th data-sort="marketProbability">Market Prob.</th>
                            <th data-sort="aiProbability">AI Prob.</th>
                            <th data-sort="gappercentage">Gap %</th>
                            <th data-sort="direction">Direction</th>
                            <th>Open</th>
                            <th data-sort="detecteddt">Detected</th>
                        </tr>
                    </thead>
                    <tbody id="opportunities-body">
                        <tr><td colspan="8">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </section>
            <!-- Details Modal -->
            <div id="details-modal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); align-items:center; justify-content:center;">
                <div class="modal-content" style="background:#fff; padding:20px; border-radius:8px; width:400px; max-width:90%;">
                    <h2>Opportunity Details</h2>
                    <p><strong>Opportunity Id:</strong> <span id="modal-opportunity-id"></span></p>
                    <p><strong>Market Id:</strong> <span id="modal-market-id"></span></p>
                    <p><strong>Question:</strong> <span id="modal-question"></span></p>
                    <p><strong>Category:</strong> <span id="modal-category"></span></p>
                    <p><strong>Slug:</strong> <span id="modal-slug"></span></p>
                    <button id="modal-close" style="margin-top:10px;">Close</button>
                </div>
            </div>
    </main>
</body>
</html>
